# Databricks Asset Bundle: the Databricks side of this project, as code.
#
#   databricks bundle validate            # check this file and the resources
#   databricks bundle deploy  -t dev      # upload code + create/update the jobs in the workspace
#   databricks bundle run     -t dev sales_backfill        # first load: 1 Oct up to today
#   databricks bundle run     -t dev sales_publish_semantic  # KPI views + metric view
#   databricks bundle run     -t dev sales_genie_health      # Genie benchmarks now (also weekly, Monday 07:00)
#   databricks bundle run     -t dev inventory_backfill      # inventory first load (after sales_backfill)
#   databricks bundle run     -t dev inventory_publish_semantic  # stock KPI views + 2 metric views
#   ... --params data_until=2026-10-29                       # backfills only: run the simulated days ahead
#   databricks bundle run     -t dev client_pipeline         # client area (SAP billing data), by hand only
#
# Cost: every schedule (daily jobs, weekly Genie check, alerts) follows `schedule_pause_status`. A deploy
# while the demo is paused must keep it paused:
#   databricks bundle deploy -t dev --var schedule_pause_status=PAUSED
#
# The workspace URL and your login come from your Databricks CLI profile (~/.databrickscfg), never from git.
# Step-by-step first deployment: docs/day15_runbook.md

bundle:
  name: sales-insights

include:
  - bundle/resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog of this project (same as `catalog` in config/config.yaml, profile dev)
    default: sales_dev
  inventory_catalog:
    description: Catalog of the inventory area (same as areas.inventory.dev.catalog in config/config.yaml)
    default: inventory_dev
  schedule_pause_status:
    description: UNPAUSED runs the daily jobs, the weekly Genie check and the alerts; PAUSED stops them all (no cost)
    default: UNPAUSED
  warehouse_id:
    description: SQL warehouse that runs the alerts, found by its name (no ID in git)
    lookup:
      warehouse: sales-insights-wh
  genie_space_id:
    description: Sales Genie agent ID (Genie > agent > About > Agent ID), used by the weekly accuracy check
    default: 01f1c2e0d41d11268063932055c6f749
  inventory_genie_space_id:
    description: Stock Genie agent ID, used by the weekly accuracy check
    default: 01f1c86d6ae21194be2ec84dabd96651
  sales_and_stock_genie_space_id:
    description: Sales & Stock (combined) Genie agent ID, used by the weekly accuracy check
    default: 01f1c94655c31de39585e07ce3c2e9f7

targets:
  dev:
    # No `mode: development`: that mode always pauses schedules (and the CLI refuses to unpause them),
    # but the demo needs the 06:30 daily job running. Files still deploy under your user folder.
    default: true
    presets:
      name_prefix: "[dev] "  # jobs show as "[dev] sales-insights-daily" so they are easy to recognise
