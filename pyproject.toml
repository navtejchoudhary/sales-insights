[project]
name = "sales-insights"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Navtej Choudhary", email = "navtejchoudhary88@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "delta-spark==4.0.*",
    "faker>=40.40.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyspark==4.0.*",
    "python-pptx==1.0.2",
    "pyyaml>=6.0.3",
]

[project.scripts]
sales-insights = "sales_insights:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
