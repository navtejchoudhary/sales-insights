# Sales metric view: the ONE place where every sales KPI is defined.
# On Databricks this becomes a Unity Catalog metric view (gold.sales_metrics) that the dashboard, Genie
# and alerts all query, so every tool computes "revenue" the same way.
# Locally, src/sales_insights/semantic/metric_views.py turns it into plain Spark SQL to test the numbers.
#
# Spec: Databricks metric view YAML 1.1 (fields, measures, joins; MEASURE() composes measures).
# Placeholders such as $${fact_sales} are replaced with real table names (local Delta paths or sales_dev.gold.*).
# Status of each KPI (confirmed / draft) is tracked in docs/kpi_definitions.md.

version: 1.1
comment: >-
  Sales KPIs for the Sri Lankan crop-protection business, one row per invoice line underneath.
  Money in LKR excluding VAT. Fiscal year April-March, labelled by its start year.
source: ${fact_sales}

joins:
  - name: customer_dim
    source: ${dim_customer}
    "on": source.customer_id = customer_dim.customer_id
  - name: product_dim
    source: ${dim_product}
    "on": source.product_id = product_dim.product_id
  - name: channel_dim
    source: ${dim_channel}
    "on": source.distribution_channel_code = channel_dim.distribution_channel_code
  - name: date_dim
    source: ${dim_date}
    "on": source.invoice_date = date_dim.date

fields:
  # --- time
  - name: invoice_date
    expr: source.invoice_date
    display_name: Invoice date
    comment: Date of the billing document. Use for daily trends.
  - name: month
    expr: date_dim.month_start_date
    display_name: Month
    comment: First day of the calendar month. Use to group by month.
    synonyms: [calendar month]
  - name: week
    expr: date_dim.week_start_date
    display_name: Week
    comment: Monday of the week.
  - name: fiscal_year
    expr: date_dim.fiscal_year_label
    display_name: Fiscal year
    comment: Fiscal year April-March, e.g. FY2026 = April 2026 to March 2027.
    synonyms: [FY, financial year]
  - name: fiscal_period
    expr: date_dim.fiscal_period
    display_name: Fiscal period
    comment: Fiscal month 1-12; 1 = April.
  - name: fiscal_quarter
    expr: date_dim.fiscal_quarter
    display_name: Fiscal quarter
    comment: Fiscal quarter 1-4; Q1 = April-June.
  - name: cultivation_season
    expr: date_dim.cultivation_season
    display_name: Cultivation season
    comment: Maha (Sep-Mar), Yala (May-Aug) or Inter-season (April).
    synonyms: [season, crop season]
  # --- geography and customer
  - name: province
    expr: customer_dim.province
    display_name: Province
    comment: Province of the customer, e.g. Western, Southern.
    synonyms: [region, area]
  - name: district
    expr: customer_dim.district_name
    display_name: District
    comment: District of the customer, e.g. Colombo.
  - name: city
    expr: customer_dim.city
    display_name: City
  - name: customer_name
    expr: customer_dim.customer_name
    display_name: Customer
    synonyms: [client, dealer, distributor]
  - name: customer_group
    expr: customer_dim.customer_group_name
    display_name: Customer group
    comment: e.g. Domestic, Distributors, Government, Plantations.
  - name: sales_office
    expr: customer_dim.sales_office_name
    display_name: Sales office
  - name: channel
    expr: channel_dim.distribution_channel_name
    display_name: Channel
    comment: General Trade, Export Sales or Modern Trade.
    synonyms: [distribution channel]
  - name: sales_rep_id
    expr: source.sales_rep_id
    display_name: Sales rep
    comment: Only filled from 22 Oct 2026.
  # --- product
  - name: product
    expr: product_dim.product_description
    display_name: Product
    synonyms: [item, material, SKU]
  - name: product_group
    expr: product_dim.product_group_name
    display_name: Product group
    comment: e.g. WEEDICIDE, INSECTICIDE, FUNGICIDE.
    synonyms: [category]
  - name: product_type
    expr: product_dim.product_type_name
    display_name: Product type
  - name: division
    expr: product_dim.division_name
    display_name: Division
  # --- document
  - name: document_type
    expr: source.document_type
    display_name: Document type
    comment: Invoice, Free of charge, Return, Cancellation or Price correction.

measures:
  - name: net_revenue
    expr: SUM(source.net_revenue_amount)
    display_name: Net revenue (LKR)
    comment: >-
      Headline revenue: invoices minus returns, cancellations and price corrections, excluding VAT.
    synonyms: [revenue, sales, net sales, turnover]
  - name: invoiced_revenue
    expr: SUM(source.invoiced_revenue_amount)
    display_name: Invoiced revenue (LKR)
    comment: Revenue on invoices and free-of-charge lines before any returns, cancellations or corrections.
    synonyms: [gross sales]
  - name: returns_value
    expr: -SUM(source.returns_amount)
    display_name: Returns (LKR)
    comment: Value of goods returned (positive number).
  - name: cancellations_value
    expr: -SUM(source.cancellations_amount)
    display_name: Cancellations (LKR)
    comment: Value of cancelled invoices (positive number).
  - name: price_corrections_value
    expr: -SUM(source.price_corrections_amount)
    display_name: Price corrections (LKR)
    comment: Credits given for pricing errors (positive number).
  - name: returns_rate_pct
    expr: MEASURE(returns_value) / NULLIF(MEASURE(invoiced_revenue), 0) * 100
    display_name: Returns rate %
    comment: Returns as a percentage of invoiced revenue.
  - name: units
    expr: SUM(source.quantity)
    display_name: Units (net)
    comment: Cases sold minus returned and cancelled.
    synonyms: [quantity, volume, cases]
  - name: invoice_count
    expr: COUNT(DISTINCT CASE WHEN source.invoice_type = 'ZAOR' AND NOT source.is_cancelled THEN source.invoice_number END)
    display_name: Invoices
    comment: Number of paid invoices that were not cancelled (free-of-charge deliveries and credit notes excluded).
    synonyms: [orders, number of invoices]
  - name: average_invoice_value
    expr: MEASURE(net_revenue) / NULLIF(MEASURE(invoice_count), 0)
    display_name: Average invoice value (LKR)
    comment: Net revenue divided by invoices.
    synonyms: [average order value, AOV]
  - name: active_customers
    expr: COUNT(DISTINCT CASE WHEN source.invoice_type = 'ZAOR' AND NOT source.is_cancelled THEN source.customer_id END)
    display_name: Active customers
    comment: Customers with at least one paid, non-cancelled invoice.
    synonyms: [buying customers]
  - name: cost
    expr: SUM(source.cost_amount)
    display_name: Standard cost (LKR)
  - name: gross_margin
    expr: SUM(source.margin_amount)
    display_name: Gross margin (LKR)
    comment: Net revenue minus standard cost. DRAFT definition, to confirm with Anil.
    synonyms: [margin, profit]
  - name: gross_margin_pct
    expr: MEASURE(gross_margin) / NULLIF(MEASURE(net_revenue), 0) * 100
    display_name: Gross margin %
    comment: Gross margin as a percentage of net revenue. DRAFT definition, to confirm with Anil.
    synonyms: [margin %, margin percentage]
  - name: tax
    expr: SUM(source.tax_amount)
    display_name: VAT (LKR)
