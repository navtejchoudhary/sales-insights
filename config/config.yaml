# One config file, two profiles, one or more business areas. Code never hardcodes paths or catalog names.
# Choose the profile with the env var SALES_PROFILE (default: local); the area with cfg.for_area() (default: sales).

profiles:
  local:
    # Runs on a Mac with PySpark + delta-spark. Paths are relative to the repo root.
    staging_path: staging            # generator writes every business day here
    landing_path: landing            # drip copies one day here (manifest last)
    lake_path: lake                  # local Delta tables live here
    catalog: null                    # no Unity Catalog locally
    schemas:
      bronze: bronze
      silver: silver
      gold: gold
      ops: ops
    processed_files_log: lake/ops/_processed_files   # stands in for the Auto Loader checkpoint
    output_path: output              # weekly decks and pipeline reports (git-ignored)

  dev:
    # Azure Databricks trial workspace (from 15 Oct). Unity Catalog names.
    staging_path: /Volumes/sales_dev/raw/staging
    landing_path: /Volumes/sales_dev/raw/landing
    lake_path: null                  # tables are managed by Unity Catalog
    catalog: sales_dev
    schemas:
      bronze: bronze
      silver: silver
      gold: gold
      ops: ops
    processed_files_log: null        # Auto Loader keeps its own checkpoint
    output_path: /Volumes/sales_dev/raw/output

# Business areas (see docs/multiple_gold_layers.md). Each area has its own pipeline: its own source
# files, landing folder, file register and bronze/silver/gold tables (own catalog on Databricks).
# - sales is the DEFAULT area and uses the profile settings above unchanged.
# - Another area lists, per profile, only the settings that differ (staging_path, landing_path,
#   lake_path, catalog, schemas, processed_files_log, output_path).
# - file_targets: which bronze table a landing file goes to, by file-name prefix
#   (orders_20261013.csv -> bronze.orders). Master files always go to bronze.masters_<name>.
# Code picks an area with cfg.for_area("inventory") or `run_pipeline --area inventory`.
areas:
  sales:
    file_targets: {orders: orders, changes: changes, invoices: invoices_history}
  inventory:
    file_targets: {movements: movements, stock: stock}
    local:
      staging_path: staging/inventory
      landing_path: landing/inventory
      lake_path: lake/inventory
      processed_files_log: lake/inventory/ops/_processed_files
      output_path: output/inventory
    dev:
      staging_path: /Volumes/inventory_dev/raw/staging
      landing_path: /Volumes/inventory_dev/raw/landing
      catalog: inventory_dev
      output_path: /Volumes/inventory_dev/raw/output

# Business settings shared by all profiles
business:
  timezone: Asia/Colombo
  country: LK
  currency: LKR
  fiscal_year_start_month: 4         # fiscal year April-March; FY is labelled by its start year (Apr 2026 = FY2026 period 1)
  simulation_start: "2026-10-01"     # first live day; history = the 18 months before it. Never change mid-project.
  history_months: 18
  reconciliation_tolerance_pct: 0.1
  random_seed: 20261001
  # Cultivation seasons (Sri Lanka): Maha Sep-Mar, Yala May-Aug; April falls between them.
  # Source: Wikipedia, "Agriculture in Sri Lanka" (Maha starts in September and ends in March; Yala May to August).
  seasons:
    Maha: [9, 10, 11, 12, 1, 2, 3]
    Yala: [5, 6, 7, 8]
  season_gap_label: Inter-season
  # Databricks-hosted model that rewrites the insight sentences (ai_query). Ignored locally.
  # Day 15: check the endpoint exists under Serving in the workspace; if not, set null (template sentences are used).
  narrative_model: databricks-meta-llama-3-3-70b-instruct
