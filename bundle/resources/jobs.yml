# Jobs for the sales insights MVP. Paths are relative to this file.
# The environment spec is repeated per job on purpose (plain YAML, no anchors).
# Every job runs bundle/run.py on serverless compute, which runs the same Python code as on the Mac
# with the `dev` profile from config/config.yaml (Unity Catalog names, /Volumes paths).

resources:
  jobs:
    # Every morning: deliver the day's files, then bronze -> silver -> gold -> reconcile -> KPIs -> answer key -> insights + deck
    sales_daily_pipeline:
      name: sales-insights-daily
      performance_target: STANDARD  # cost: scheduled, nobody waits; a few minutes slower start, cheaper serverless
      description: Daily sales pipeline (see docs/pipeline.md). Fails if reconciliation, KPI or story checks fail.
      max_concurrent_runs: 1
      timeout_seconds: 3600  # cost guard: a stuck run is stopped after 1 hour (a normal run takes minutes)
      schedule:
        quartz_cron_expression: "0 30 6 * * ?"  # 06:30 every day
        timezone_id: Asia/Colombo
        pause_status: ${var.schedule_pause_status}
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      tasks:
        - task_key: pipeline
          environment_key: default
          spark_python_task:
            python_file: ../run.py
            parameters: ["pipeline", "--profile", "dev", "--date", "{{job.start_time.iso_date}}"]
      environments:
        - environment_key: default
          spec:
            environment_version: "6"  # serverless environment 6: Python 3.12 (check on Day 15)
            dependencies:
              - numpy>=2.5.3
              - pandas>=3.0.6
              - pyyaml>=6.0.3
              - python-pptx==1.0.2

    # Generate and load everything from 1 Oct up to `data_until` (downstream steps only at the end).
    # data_until = "today" by default; give a date to run the simulated days ahead, e.g. for a demo:
    #   databricks bundle run -t dev sales_backfill --params data_until=2026-10-29
    sales_backfill:
      name: sales-insights-backfill
      description: Load on Databricks - master data, 18-month history and every day from 1 Oct to data_until (default today).
      max_concurrent_runs: 1
      timeout_seconds: 7200  # cost guard: stopped after 2 hours
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      parameters:
        - name: data_until
          default: today  # bundle/run.py turns "today" into today's date (Asia/Colombo)
      tasks:
        - task_key: backfill
          environment_key: default
          spark_python_task:
            python_file: ../run.py
            parameters: ["pipeline", "--profile", "dev", "--from", "2026-10-01", "--to", "{{job.parameters.data_until}}", "--downstream", "last"]
      environments:
        - environment_key: default
          spec:
            environment_version: "6"  # serverless environment 6: Python 3.12 (check on Day 15)
            dependencies:
              - numpy>=2.5.3
              - pandas>=3.0.6
              - pyyaml>=6.0.3
              - python-pptx==1.0.2

    # After gold exists: permanent KPI views + the Unity Catalog metric view (re-run when a KPI formula changes)
    sales_publish_semantic:
      name: sales-insights-publish-semantic
      description: Creates gold.kpi_* views and the metric view gold.sales_metrics, then proves they agree.
      max_concurrent_runs: 1
      timeout_seconds: 1800  # cost guard: stopped after 30 minutes
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      tasks:
        - task_key: publish
          environment_key: default
          spark_python_task:
            python_file: ../run.py
            parameters: ["kpis", "--profile", "dev"]
      environments:
        - environment_key: default
          spec:
            environment_version: "6"  # serverless environment 6: Python 3.12 (check on Day 15)
            dependencies:
              - numpy>=2.5.3
              - pandas>=3.0.6
              - pyyaml>=6.0.3
              - python-pptx==1.0.2

    # Every Monday after the daily run: run all benchmarks of the 3 Genie agents one after the other, record each
    # score in sales_dev.ops.genie_accuracy (column agent), fail (= email) when any agent is below 90%
    sales_genie_health:
      name: sales-insights-genie-health
      performance_target: STANDARD  # cost: scheduled, nobody waits; a few minutes slower start, cheaper serverless
      description: Weekly Genie accuracy check of the Sales, Stock and Sales & Stock agents (all benchmark questions, Chat mode). Fails below the 90% target.
      max_concurrent_runs: 1
      timeout_seconds: 5400  # cost guard: 3 evaluations of about 15-20 minutes each
      schedule:
        quartz_cron_expression: "0 0 7 ? * MON"  # Monday 07:00
        timezone_id: Asia/Colombo
        pause_status: ${var.schedule_pause_status}
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      tasks:  # one after the other (one warehouse); each runs even when the one before failed (run_if ALL_DONE)
        - task_key: genie_health
          environment_key: default
          spark_python_task:
            python_file: ../run.py
            parameters: ["genie_health", "--profile", "dev", "--space-id", "${var.genie_space_id}", "--agent", "sales", "--target", "90"]
        - task_key: genie_health_stock
          depends_on: [{task_key: genie_health}]
          run_if: ALL_DONE
          environment_key: default
          spark_python_task:
            python_file: ../run.py
            parameters: ["genie_health", "--profile", "dev", "--space-id", "${var.inventory_genie_space_id}", "--agent", "inventory", "--target", "90"]
        - task_key: genie_health_sales_and_stock
          depends_on: [{task_key: genie_health_stock}]
          run_if: ALL_DONE
          environment_key: default
          spark_python_task:
            python_file: ../run.py
            parameters: ["genie_health", "--profile", "dev", "--space-id", "${var.sales_and_stock_genie_space_id}", "--agent", "sales_and_stock", "--target", "90"]
      environments:
        - environment_key: default
          spec:
            environment_version: "6"  # serverless environment 6: Python 3.12
            dependencies:
              - numpy>=2.5.3
              - pandas>=3.0.6
              - pyyaml>=6.0.3
              - python-pptx==1.0.2
              - databricks-sdk  # latest: the Genie evaluation API is new (beta)

    # ---------------------------------------------------------------- inventory area (catalog inventory_dev)
    # Same code, `--area inventory`. It reads the sales gold, so it runs after the sales job.
    # First: run inventory_backfill once (after sales_backfill reached the same date), then the daily job
    # carries on by itself. Sales jobs and the sales_dev catalog are not touched by any of these.

    # Once: the stock locations, 18 months of stock history and every day from 1 Oct to data_until
    inventory_backfill:
      name: inventory-backfill
      description: Inventory first load - locations, stock history and every day from 1 Oct to data_until (default today). Run after sales_backfill.
      max_concurrent_runs: 1
      timeout_seconds: 7200  # cost guard: stopped after 2 hours
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      parameters:
        - name: data_until
          default: today  # use the same date as the sales backfill
      tasks:
        - task_key: backfill
          environment_key: default
          spark_python_task:
            python_file: ../run.py
            parameters: ["pipeline", "--profile", "dev", "--area", "inventory", "--from", "2026-10-01", "--to", "{{job.parameters.data_until}}", "--downstream", "last"]
      environments:
        - environment_key: default
          spec:
            environment_version: "6"  # serverless environment 6: Python 3.12
            dependencies:
              - numpy>=2.5.3
              - pandas>=3.0.6
              - pyyaml>=6.0.3
              - python-pptx==1.0.2

    # Every morning at 07:00, after the 06:30 sales job: drip -> bronze -> silver -> gold -> checks -> KPIs -> answer keys
    inventory_daily_pipeline:
      name: inventory-daily
      performance_target: STANDARD  # cost: scheduled, nobody waits
      description: Daily inventory pipeline (docs/pipeline.md, inventory area). Fails if a stock check, KPI or story check fails; sales is unaffected.
      max_concurrent_runs: 1
      timeout_seconds: 3600  # cost guard: stopped after 1 hour
      schedule:
        quartz_cron_expression: "0 0 7 * * ?"  # 07:00 every day, 30 minutes after the sales job
        timezone_id: Asia/Colombo
        pause_status: ${var.schedule_pause_status}
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      tasks:
        - task_key: pipeline
          environment_key: default
          spark_python_task:
            python_file: ../run.py
            parameters: ["pipeline", "--profile", "dev", "--area", "inventory", "--date", "{{job.start_time.iso_date}}"]
      environments:
        - environment_key: default
          spec:
            environment_version: "6"  # serverless environment 6: Python 3.12
            dependencies:
              - numpy>=2.5.3
              - pandas>=3.0.6
              - pyyaml>=6.0.3
              - python-pptx==1.0.2

    # After the inventory gold exists: KPI views + the two metric views (inventory_metrics, sales_and_stock)
    inventory_publish_semantic:
      name: inventory-publish-semantic
      description: Creates inventory_dev.gold.kpi_* views and the metric views inventory_metrics and sales_and_stock, then proves they agree.
      max_concurrent_runs: 1
      timeout_seconds: 1800  # cost guard: stopped after 30 minutes
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      tasks:
        - task_key: publish
          environment_key: default
          spark_python_task:
            python_file: ../run.py
            parameters: ["kpis", "--profile", "dev", "--area", "inventory"]
      environments:
        - environment_key: default
          spec:
            environment_version: "6"  # serverless environment 6: Python 3.12
            dependencies:
              - numpy>=2.5.3
              - pandas>=3.0.6
              - pyyaml>=6.0.3
              - python-pptx==1.0.2

    # ---------------------------------------------------------------- client area (catalog client_dev)
    # SAP billing data (docs/sap_input_contract.md). NO schedule: it runs only when started by hand
    #   databricks bundle run -t dev client_pipeline --profile sales-dev
    # so it never costs anything on its own. The data is one copy, not a daily feed. With `source: dummy`
    # (config.yaml) the first run generates SAP-shaped dummy files in the volume; with `source: real` it only
    # loads the copied files and stops if they are missing. Setup first: sql/setup/client_dev.sql.
    client_pipeline:
      name: client-pipeline
      performance_target: STANDARD  # cost: cheaper serverless; a few minutes slower start is fine
      description: Client area (SAP billing data) - bronze, silver, gold, reconciliation and KPI check, then publishes the KPI views and the metric view client_dev.gold.sales_metrics. Manual runs only.
      max_concurrent_runs: 1
      timeout_seconds: 3600  # cost guard: stopped after 1 hour (a run takes about 10 minutes)
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      tasks:
        - task_key: pipeline
          environment_key: default
          spark_python_task:
            python_file: ../run.py
            parameters: ["pipeline", "--profile", "dev", "--area", "client", "--date", "today"]
        - task_key: publish
          depends_on: [{task_key: pipeline}]  # only after every check passed
          environment_key: default
          spark_python_task:
            python_file: ../run.py
            parameters: ["kpis", "--profile", "dev", "--area", "client"]
      environments:
        - environment_key: default
          spec:
            environment_version: "6"  # serverless environment 6: Python 3.12
            dependencies:
              - numpy>=2.5.3
              - pandas>=3.0.6
              - pyyaml>=6.0.3
              - python-pptx==1.0.2
