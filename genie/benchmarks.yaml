    story: 5 HEX FUNGICIDE 1LTR launched 15 June 2026, ramping up
    question: When did HEX FUNGICIDE 1LTR start selling, and how have its monthly sales developed?
    paraphrases:
      - How is the new HEX FUNGICIDE 1LTR doing month by month since launch?
      - Monthly revenue of HEX FUNGICIDE 1LTR since its first sale?
