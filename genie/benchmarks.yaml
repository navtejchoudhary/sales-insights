  # ---------------------------------------------------------------- story 6: returns spike
  - id: B17
    category: story
    story: 6 Returns spike on HGL INSECTICIDE 400ML from 1 July 2026
    question: Which product had the highest returns rate since 1 July 2026?
    paraphrases:
      - Which product is being returned the most since July 2026?
      - Highest returns percentage by product from 1 July 2026 onwards?
    sql: |
      SELECT f.product_id, p.product_description AS product,
             ROUND(-SUM(f.returns_amount) / SUM(f.invoiced_revenue_amount) * 100, 2) AS returns_rate_pct
      FROM ${fact_sales} f JOIN ${dim_product} p ON f.product_id = p.product_id
      WHERE f.invoice_date >= DATE'2026-07-01'
      GROUP BY f.product_id, p.product_description
      HAVING SUM(f.invoiced_revenue_amount) > 0
      ORDER BY returns_rate_pct DESC LIMIT 5
    check: row['product_id'] == 'HGL400ML'

  - id: B18
    category: story
    story: 6 Returns spike on HGL INSECTICIDE 400ML from 1 July 2026
    question: How did the returns rate of HGL INSECTICIDE 400ML change after 1 July 2026?
    paraphrases:
      - Did the returns rate of HGL INSECTICIDE 400ML go up after 1 July 2026?
      - Returns rate of HGL INSECTICIDE 400ML before and after 1 July 2026?
    sql: |
      SELECT
        ROUND(-SUM(CASE WHEN invoice_date <  DATE'2026-07-01' THEN returns_amount END)
             / NULLIF(SUM(CASE WHEN invoice_date <  DATE'2026-07-01' THEN invoiced_revenue_amount END), 0) * 100, 1) AS before_pct,
        ROUND(-SUM(CASE WHEN invoice_date >= DATE'2026-07-01' THEN returns_amount END)
             / NULLIF(SUM(CASE WHEN invoice_date >= DATE'2026-07-01' THEN invoiced_revenue_amount END), 0) * 100, 1) AS after_pct
      FROM ${fact_sales}
      WHERE product_id = 'HGL400ML'
    check: row['after_pct'] > 5 * row['before_pct']

  # ---------------------------------------------------------------- story 1: seasons
  - id: B19
    category: story
    story: 1 Demand peaks before Maha (Sep-Nov) and Yala (Mar-May)
    question: Which calendar months have the highest net revenue on average?
    paraphrases:
      - In which months of the year are sales usually highest?
      - 'Average revenue by calendar month: which months peak?'
    sql: |
      WITH m AS (
        SELECT d.month_start_date, d.month, SUM(f.net_revenue_amount) AS revenue
        FROM ${fact_sales} f JOIN ${dim_date} d ON f.invoice_date = d.date
        WHERE NOT d.is_month_to_date
        GROUP BY d.month_start_date, d.month
      )
      SELECT month, ROUND(AVG(revenue), 2) AS avg_monthly_revenue FROM m GROUP BY month ORDER BY avg_monthly_revenue DESC
    check: set(r['month'] for r in rows[:6]) == {3, 4, 5, 9, 10, 11}

  - id: B20
    category: basic
    question: Compare net revenue in the Maha and Yala seasons of fiscal year 2025.
    paraphrases:
      - Maha versus Yala season sales in FY2025?
      - Which sold more in fiscal year 2025, the Maha season or the Yala season?
    sql: |
      SELECT ROUND(SUM(CASE WHEN d.cultivation_season = 'Maha' THEN f.net_revenue_amount END), 2) AS maha_net_revenue,
             ROUND(SUM(CASE WHEN d.cultivation_season = 'Yala' THEN f.net_revenue_amount END), 2) AS yala_net_revenue
      FROM ${fact_sales} f JOIN ${dim_date} d ON f.invoice_date = d.date
      WHERE d.fiscal_year = 2025
    check: row['maha_net_revenue'] > row['yala_net_revenue']

  # ---------------------------------------------------------------- customers and channels
  - id: B21
    category: basic
    question: What was net revenue by distribution channel in fiscal year 2025?
    paraphrases:
      - Sales split by channel for FY2025?
      - How much did General Trade, Modern Trade and Export Sales each sell in fiscal year 2025?
    sql: |
      SELECT ch.distribution_channel_name AS channel, ROUND(SUM(f.net_revenue_amount), 2) AS net_revenue
      FROM ${fact_sales} f
      JOIN ${dim_date} d ON f.invoice_date = d.date
      JOIN ${dim_channel} ch ON f.distribution_channel_code = ch.distribution_channel_code
      WHERE d.fiscal_year = 2025
      GROUP BY ch.distribution_channel_name ORDER BY net_revenue DESC
    check: row['channel'] == 'General Trade'

  - id: B22
    category: basic
    question: Which customer group generated the most net revenue in fiscal year 2025?
    paraphrases:
      - Which customer segment brought the most revenue in FY2025?
      - 'Revenue by customer group for fiscal year 2025: which is largest?'
    sql: |
      SELECT c.customer_group_name AS customer_group, ROUND(SUM(f.net_revenue_amount), 2) AS net_revenue
      FROM ${fact_sales} f
      JOIN ${dim_date} d ON f.invoice_date = d.date
      JOIN ${dim_customer} c ON f.customer_id = c.customer_id
      WHERE d.fiscal_year = 2025
      GROUP BY c.customer_group_name ORDER BY net_revenue DESC
    check: row['customer_group'] == 'Distributors'

  - id: B23
    category: basic
    question: Who were the top 10 customers by net revenue in fiscal year 2025?
    paraphrases:
      - List our 10 biggest customers in FY2025.
      - Top 10 customers by sales in fiscal year 2025?
    sql: |
      SELECT c.customer_name, ROUND(SUM(f.net_revenue_amount), 2) AS net_revenue
      FROM ${fact_sales} f
      JOIN ${dim_date} d ON f.invoice_date = d.date
      JOIN ${dim_customer} c ON f.customer_id = c.customer_id
      WHERE d.fiscal_year = 2025
      GROUP BY c.customer_name ORDER BY net_revenue DESC LIMIT 10
    check: len(rows) == 10

  # ---------------------------------------------------------------- returns, cancellations, margin
  - id: B24
    category: basic
    question: How much revenue did returns cost us in fiscal year 2025, and what was the returns rate?
    paraphrases:
      - What was the value of returns in FY2025 and the returns percentage?
      - How much did we lose to returns in fiscal year 2025, and what percentage of invoiced sales was that?
    sql: |
      SELECT ROUND(-SUM(f.returns_amount), 2) AS returns_value,
             ROUND(-SUM(f.returns_amount) / NULLIF(SUM(f.invoiced_revenue_amount), 0) * 100, 1) AS returns_rate_pct
      FROM ${fact_sales} f JOIN ${dim_date} d ON f.invoice_date = d.date
      WHERE d.fiscal_year = 2025

  - id: B25
    category: basic
    question: How many invoices were cancelled in fiscal year 2025 and what was their value?
    paraphrases:
      - Number and value of invoice cancellations in FY2025?
      - How many cancellations did we have in fiscal year 2025, and how much were they worth?
    sql: |
      SELECT COUNT(DISTINCT f.invoice_number) AS cancellation_documents,
             ROUND(-SUM(f.cancellations_amount), 2) AS cancelled_value
      FROM ${fact_sales} f JOIN ${dim_date} d ON f.invoice_date = d.date
      WHERE d.fiscal_year = 2025 AND f.invoice_type = 'S1'

  - id: B26
    category: basic
    question: What was gross margin % by product group in fiscal year 2025?
    paraphrases:
      - Margin percentage by product category for FY2025?
      - Which product group had the best gross margin % in fiscal year 2025?
    sql: |
      SELECT p.product_group_name AS product_group,
             ROUND(SUM(f.margin_amount) / NULLIF(SUM(f.net_revenue_amount), 0) * 100, 1) AS gross_margin_pct
      FROM ${fact_sales} f
      JOIN ${dim_date} d ON f.invoice_date = d.date
      JOIN ${dim_product} p ON f.product_id = p.product_id
      WHERE d.fiscal_year = 2025
      GROUP BY p.product_group_name ORDER BY SUM(f.net_revenue_amount) DESC

  # ---------------------------------------------------------------- tricky: relative dates, partial months
  - id: B27
    category: tricky
    question: What were sales last month?
    paraphrases:
      - How much did we sell last month?
      - What was revenue in the previous month?
    notes: '"Last month" = the last COMPLETE calendar month in the data, not the current partial month.'
    sql: |
      WITH last AS (
        SELECT CASE WHEN MAX(invoice_date) = LAST_DAY(MAX(invoice_date)) THEN TRUNC(MAX(invoice_date), 'MM')
                    ELSE ADD_MONTHS(TRUNC(MAX(invoice_date), 'MM'), -1) END AS m
        FROM ${fact_sales})
      SELECT l.m AS month, ROUND(SUM(f.net_revenue_amount), 2) AS net_revenue
      FROM ${fact_sales} f CROSS JOIN last l
      WHERE TRUNC(f.invoice_date, 'MM') = l.m
      GROUP BY l.m

  - id: B28
    category: tricky
    question: How are sales this month compared with the same days last month?
    paraphrases:
      - How is this month going compared with last month so far?
      - Month-to-date sales versus the same days last month?
    notes: The current month is incomplete, so compare like-for-like (day 1 to today vs the same days last month).
    sql: |
      WITH b AS (SELECT MAX(invoice_date) AS today, TRUNC(MAX(invoice_date), 'MM') AS m0 FROM ${fact_sales})
      SELECT b.m0 AS month, b.today AS data_until,
             ROUND(SUM(CASE WHEN f.invoice_date BETWEEN b.m0 AND b.today THEN f.net_revenue_amount END), 2) AS month_to_date,
             ROUND(SUM(CASE WHEN f.invoice_date BETWEEN ADD_MONTHS(b.m0, -1) AND ADD_MONTHS(b.today, -1)
                            THEN f.net_revenue_amount END), 2) AS same_days_last_month
      FROM ${fact_sales} f CROSS JOIN b
      GROUP BY b.m0, b.today

  - id: B29
    category: tricky
    question: Rank the districts in Western province by net revenue for fiscal year 2025.
    paraphrases:
      - Western province districts by sales in FY2025, highest first?
      - Within Western province, which districts sold the most in fiscal year 2025? Show all of them ranked.
    sql: |
      SELECT c.district_name AS district, ROUND(SUM(f.net_revenue_amount), 2) AS net_revenue
      FROM ${fact_sales} f
      JOIN ${dim_date} d ON f.invoice_date = d.date
      JOIN ${dim_customer} c ON f.customer_id = c.customer_id
      WHERE d.fiscal_year = 2025 AND c.province = 'Western'
      GROUP BY c.district_name ORDER BY net_revenue DESC

  # ---------------------------------------------------------------- story 7: live demo week
  - id: B30
    category: story
    story: 7 Top seller MC600 WEEDICIDE 1LTR out of stock in Western from 23 October 2026
    question: Have sales of MC600 WEEDICIDE 1LTR in Western province stopped since 23 October 2026?
    paraphrases:
      - Has MC600 WEEDICIDE 1LTR stopped selling in Western province since 23 October 2026?
      - Any MC600 WEEDICIDE 1LTR sales in the Western region after 23 Oct 2026?
    needs_data_until: 2026-10-25
    sql: |
      SELECT
        COALESCE(SUM(CASE WHEN f.invoice_date >= DATE'2026-10-23' AND f.invoice_type = 'ZAOR' THEN f.quantity END), 0) AS units_since_23_oct,
        ROUND(SUM(CASE WHEN f.invoice_date BETWEEN DATE'2026-09-23' AND DATE'2026-10-22' AND f.invoice_type = 'ZAOR'
                       THEN f.quantity END) / 30, 1) AS avg_daily_units_before
      FROM ${fact_sales} f JOIN ${dim_customer} c ON f.customer_id = c.customer_id
      WHERE f.product_id = 'MC6001LT' AND c.province = 'Western'
    check: row['units_since_23_oct'] == 0 and row['avg_daily_units_before'] > 0
