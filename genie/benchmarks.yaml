    check: len(rows) == 9

  # ---------------------------------------------------------------- story 2: concentration
  - id: B12
    category: story
    story: 2 A few products bring most revenue
    question: What share of fiscal year 2025 net revenue came from the top 8 products?
    paraphrases:
      - 'How concentrated are our sales: what percentage of FY2025 revenue came from our 8 best products?'
      - Share of FY2025 sales from the top 8 products?
    sql: |
      WITH p AS (
        SELECT f.product_id, SUM(f.net_revenue_amount) AS revenue
        FROM ${fact_sales} f JOIN ${dim_date} d ON f.invoice_date = d.date
        WHERE d.fiscal_year = 2025
        GROUP BY f.product_id
      ), ranked AS (SELECT revenue, ROW_NUMBER() OVER (ORDER BY revenue DESC) AS rn FROM p)
      SELECT ROUND(SUM(CASE WHEN rn <= 8 THEN revenue END) / NULLIF(SUM(revenue), 0) * 100, 1) AS top8_share_pct FROM ranked
    check: row['top8_share_pct'] >= 60

  - id: B13
    category: basic
    question: What were the top 5 products by net revenue in fiscal year 2025?
    paraphrases:
      - Top 5 best-selling products in FY2025 by revenue?
      - Which 5 products brought in the most revenue in fiscal year 2025?
    sql: |
      SELECT p.product_description AS product, ROUND(SUM(f.net_revenue_amount), 2) AS net_revenue
      FROM ${fact_sales} f
      JOIN ${dim_date} d ON f.invoice_date = d.date
      JOIN ${dim_product} p ON f.product_id = p.product_id
      WHERE d.fiscal_year = 2025
      GROUP BY p.product_description ORDER BY net_revenue DESC LIMIT 5
    check: len(rows) == 5

  # ---------------------------------------------------------------- story 4: weedicide price rise
  - id: B14
    category: story
    story: 4 Weedicide price rise of 8% from 1 April 2026
    question: By how much did the price per case of weedicide products change after 1 April 2026?
    paraphrases:
      - How much did weedicide prices go up after April 2026?
      - Average price change per case for weedicides since 1 April 2026?
    sql: |
      WITH per_product AS (
        SELECT f.product_id,
               SUM(CASE WHEN f.invoice_date <  DATE'2026-04-01' THEN f.net_revenue_amount END)
             / NULLIF(SUM(CASE WHEN f.invoice_date <  DATE'2026-04-01' THEN f.quantity END), 0) AS price_before,
               SUM(CASE WHEN f.invoice_date >= DATE'2026-04-01' THEN f.net_revenue_amount END)
             / NULLIF(SUM(CASE WHEN f.invoice_date >= DATE'2026-04-01' THEN f.quantity END), 0) AS price_after
        FROM ${fact_sales} f JOIN ${dim_product} p ON f.product_id = p.product_id
        WHERE p.product_group_name = 'WEEDICIDE' AND f.invoice_type = 'ZAOR'
        GROUP BY f.product_id
      )
      SELECT ROUND(AVG((price_after / NULLIF(price_before, 0) - 1) * 100), 1) AS avg_price_change_pct,
             COUNT(*) AS products
      FROM per_product WHERE price_before IS NOT NULL AND price_after IS NOT NULL
    check: 6 <= row['avg_price_change_pct'] <= 10

  - id: B15
    category: story
    story: 4 Weedicide volume lags after the price rise
    question: How did units of weedicide, insecticide and fungicide each grow from April-September 2025 to April-September 2026?
    paraphrases:
      - Unit growth by crop chemical group (weedicide, insecticide, fungicide), April-September 2026 versus April-September 2025?
      - Did weedicide volumes grow as fast as insecticide and fungicide volumes between April-September 2025 and April-September 2026? Show each group's growth.
    notes: One row per product group; the story is that weedicide grows far less than the other two.
    sql: |
      SELECT p.product_group_name AS product_group,
             ROUND((SUM(CASE WHEN f.invoice_date BETWEEN DATE'2026-04-01' AND DATE'2026-09-30' THEN f.quantity END)
                  / NULLIF(SUM(CASE WHEN f.invoice_date BETWEEN DATE'2025-04-01' AND DATE'2025-09-30' THEN f.quantity END), 0)
                  - 1) * 100, 1) AS units_growth_pct
      FROM ${fact_sales} f JOIN ${dim_product} p ON f.product_id = p.product_id
      WHERE p.product_group_name IN ('WEEDICIDE', 'INSECTICIDE', 'FUNGICIDE')
      GROUP BY p.product_group_name ORDER BY units_growth_pct
    check: rows[0]['product_group'] == 'WEEDICIDE' and rows[0]['units_growth_pct'] < rows[1]['units_growth_pct'] - 5

