# Genie benchmark questions: the answer key.
#
# Each question has the ground-truth SQL that answers it correctly on the gold tables. On Databricks these
# become the Genie agent's BENCHMARKS (question + SQL answer), so Genie's accuracy is scored, not guessed.
# `uv run python -m sales_insights.semantic.answer_key` runs every query on the current gold data and writes
# genie/answer_key.csv with the expected answers. `check` (optional) is a Python expression that must be
# true on the result: it proves the planted story is visible in the data. `row` = first row, `rows` = all rows.
# `needs_data_until`: the check is PENDING until the data reaches that date (demo-week stories).
# `paraphrases`: the same question worded differently. They become extra benchmarks (same SQL), so the score
# measures whether Genie understands managers, not whether it memorised our wording.
# Placeholders like $${fact_sales} are replaced with real table names.
#
# Conventions used by every query (the same as the metric view):
#   net revenue  = SUM(net_revenue_amount)          (already net of returns, cancellations, price corrections)
#   invoices     = distinct invoice_number where invoice_type = 'ZAOR' AND NOT is_cancelled
#   fiscal year  = April-March, labelled by start year (FY2025 = 1 Apr 2025 - 31 Mar 2026)

questions:
  # ---------------------------------------------------------------- basics
  - id: B01
    category: basic
    question: What was total net revenue in fiscal year 2025?
    paraphrases:
      - How much did we sell in FY2025?
      - Total sales for financial year 2025 (April 2025 to March 2026)?
    sql: |
      SELECT ROUND(SUM(f.net_revenue_amount), 2) AS net_revenue
      FROM ${fact_sales} f JOIN ${dim_date} d ON f.invoice_date = d.date
      WHERE d.fiscal_year = 2025
    check: row['net_revenue'] > 0

  - id: B02
    category: basic
    question: What was net revenue in September 2026?
    paraphrases:
      - How much revenue did we make in Sep 2026?
      - What were total sales for September 2026?
    sql: |
      SELECT ROUND(SUM(net_revenue_amount), 2) AS net_revenue
      FROM ${fact_sales}
      WHERE invoice_date BETWEEN DATE'2026-09-01' AND DATE'2026-09-30'

  - id: B03
    category: basic
    question: How many invoices did we issue in September 2026?
    paraphrases:
      - How many orders did we get in September 2026?
      - Number of invoices in Sep 2026?
    sql: |
      SELECT COUNT(DISTINCT invoice_number) AS invoices
      FROM ${fact_sales}
      WHERE invoice_type = 'ZAOR' AND NOT is_cancelled
        AND invoice_date BETWEEN DATE'2026-09-01' AND DATE'2026-09-30'

  - id: B04
    category: basic
    question: What was the average invoice value in fiscal year 2025?
    paraphrases:
      - What was our average order value in FY2025?
      - On average, how much was one invoice worth in fiscal year 2025?
    sql: |
      SELECT ROUND(SUM(f.net_revenue_amount)
               / NULLIF(COUNT(DISTINCT CASE WHEN f.invoice_type = 'ZAOR' AND NOT f.is_cancelled THEN f.invoice_number END), 0), 2)
             AS average_invoice_value
      FROM ${fact_sales} f JOIN ${dim_date} d ON f.invoice_date = d.date
      WHERE d.fiscal_year = 2025

  - id: B05
    category: basic
    question: How many active customers did we have in September 2026 compared with September 2025?
    paraphrases:
      - Compare the number of buying customers in Sep 2026 and Sep 2025.
      - How many customers bought from us in September 2026, and how many a year earlier?
    sql: |
      SELECT
        COUNT(DISTINCT CASE WHEN invoice_date BETWEEN DATE'2026-09-01' AND DATE'2026-09-30' THEN customer_id END) AS sep_2026,
        COUNT(DISTINCT CASE WHEN invoice_date BETWEEN DATE'2025-09-01' AND DATE'2025-09-30' THEN customer_id END) AS sep_2025
      FROM ${fact_sales}
      WHERE invoice_type = 'ZAOR' AND NOT is_cancelled

  # ---------------------------------------------------------------- trends and growth
  - id: B06
    category: trend
    question: Show monthly net revenue for fiscal year 2025.
    paraphrases:
      - Monthly sales trend for FY2025.
      - Give me revenue for each month of fiscal year 2025.
    sql: |
      SELECT d.month_start_date AS month, ROUND(SUM(f.net_revenue_amount), 2) AS net_revenue
      FROM ${fact_sales} f JOIN ${dim_date} d ON f.invoice_date = d.date
      WHERE d.fiscal_year = 2025
      GROUP BY d.month_start_date ORDER BY month
    check: len(rows) == 12

  - id: B07
    category: trend
    question: What was month-on-month revenue growth in September 2026?
    paraphrases:
      - By what percentage did sales change from August to September 2026?
      - Month-over-month sales growth for September 2026?
    sql: |
      SELECT
        ROUND(SUM(CASE WHEN invoice_date BETWEEN DATE'2026-09-01' AND DATE'2026-09-30' THEN net_revenue_amount END), 2) AS sep_2026,
        ROUND(SUM(CASE WHEN invoice_date BETWEEN DATE'2026-08-01' AND DATE'2026-08-31' THEN net_revenue_amount END), 2) AS aug_2026,
        ROUND((SUM(CASE WHEN invoice_date BETWEEN DATE'2026-09-01' AND DATE'2026-09-30' THEN net_revenue_amount END)
             / NULLIF(SUM(CASE WHEN invoice_date BETWEEN DATE'2026-08-01' AND DATE'2026-08-31' THEN net_revenue_amount END), 0) - 1) * 100, 1)
          AS growth_pct
      FROM ${fact_sales}

  - id: B08
    category: trend
    question: How did revenue in July to September 2026 compare with July to September 2025?
    paraphrases:
      - Compare Q2 of FY2026 (July-September 2026) with the same quarter a year earlier.
      - Is revenue for July-September 2026 up or down versus July-September 2025, and by how much?
    sql: |
      SELECT
        ROUND(SUM(CASE WHEN invoice_date BETWEEN DATE'2026-07-01' AND DATE'2026-09-30' THEN net_revenue_amount END), 2) AS q_2026,
        ROUND(SUM(CASE WHEN invoice_date BETWEEN DATE'2025-07-01' AND DATE'2025-09-30' THEN net_revenue_amount END), 2) AS q_2025,
        ROUND((SUM(CASE WHEN invoice_date BETWEEN DATE'2026-07-01' AND DATE'2026-09-30' THEN net_revenue_amount END)
             / NULLIF(SUM(CASE WHEN invoice_date BETWEEN DATE'2025-07-01' AND DATE'2025-09-30' THEN net_revenue_amount END), 0) - 1) * 100, 1)
          AS growth_pct
      FROM ${fact_sales}
    check: row['growth_pct'] > 0

  # ---------------------------------------------------------------- story 3: geography
  - id: B09
    category: story
    story: 3 Southern province underperforms
    question: Which province has the lowest net revenue per active customer in fiscal year 2025?
    paraphrases:
      - Which region earns the least per buying customer in FY2025?
      - Lowest sales per active customer by province, fiscal year 2025?
    sql: |
      SELECT c.province,
             ROUND(SUM(f.net_revenue_amount)
                 / NULLIF(COUNT(DISTINCT CASE WHEN f.invoice_type = 'ZAOR' AND NOT f.is_cancelled THEN f.customer_id END), 0), 2)
               AS revenue_per_active_customer
      FROM ${fact_sales} f
      JOIN ${dim_date} d ON f.invoice_date = d.date
      JOIN ${dim_customer} c ON f.customer_id = c.customer_id
      WHERE d.fiscal_year = 2025
      GROUP BY c.province ORDER BY revenue_per_active_customer ASC
    check: row['province'] == 'Southern'

  - id: B10
    category: story
    story: 3 Northern province is strongest
    question: Which province has the highest net revenue per active customer in fiscal year 2025?
    paraphrases:
      - Which region earns the most per customer in FY2025?
      - Highest revenue per active customer by province for fiscal year 2025?
    sql: |
      SELECT c.province,
             ROUND(SUM(f.net_revenue_amount)
                 / NULLIF(COUNT(DISTINCT CASE WHEN f.invoice_type = 'ZAOR' AND NOT f.is_cancelled THEN f.customer_id END), 0), 2)
               AS revenue_per_active_customer
      FROM ${fact_sales} f
      JOIN ${dim_date} d ON f.invoice_date = d.date
      JOIN ${dim_customer} c ON f.customer_id = c.customer_id
      WHERE d.fiscal_year = 2025
