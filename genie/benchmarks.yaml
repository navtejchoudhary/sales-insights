  - id: B11
    category: basic
    question: Rank the provinces by net revenue in fiscal year 2025.
    paraphrases:
      - Show sales by province for FY2025, highest first.
      - Which provinces sold the most in fiscal year 2025?
    sql: |
      SELECT c.province, ROUND(SUM(f.net_revenue_amount), 2) AS net_revenue
      FROM ${fact_sales} f
      JOIN ${dim_date} d ON f.invoice_date = d.date
      JOIN ${dim_customer} c ON f.customer_id = c.customer_id
      WHERE d.fiscal_year = 2025
