# Genie agent "Sales & Stock" (combined) configuration: questions that need sales and stock together.
# It stands in for a supervisor agent over the Sales and Stock agents (not available in our workspace).
# Setup steps: genie/sales_and_stock/README.md. Placeholders like $${fact_sales_stock_daily} are replaced with
# real table names: inventory tables from inventory_dev.gold, sales tables and shared dimensions from sales_dev.gold.

title: Sri Lankan Crop Protection Sales and Stock
description: >-
  Ask questions that link sales and stock: did a product stop selling because a depot ran out, how much cover
  the depots have against what customers buy, where returns pile up. Data from 1 April 2025, updated daily.

# Data assets (6). The metric view and fact_sales_stock_daily hold sales next to depot stock per day, sales
# office and product; fact_stock_daily and fact_stock_movements cover the hub, plant stores and transfers.
data:
  - ${sales_and_stock}
  - ${fact_sales_stock_daily}
  - ${fact_stock_daily}
  - ${fact_stock_movements}
  - ${dim_location}
  - ${dim_product}

instructions: |
  - Money is LKR excluding VAT; quantities are in each product's base unit. Round money to 2 decimals, percentages and days to 1.
  - fact_sales_stock_daily: one row per day, sales office and product, with the office's sales next to the closing stock of the depot that serves it. Province and depot come from dim_location via location_id (the depot's province is its customers' province).
  - Sales columns (net_revenue_amount, invoiced_quantity, sales_quantity, issued_quantity) add up over days. Stock columns (stock_quantity, in_transit_quantity) are levels: for a period use its last day, never a sum (MEASURE(depot_stock) does this).
  - Revenue = SUM(net_revenue_amount). Units sold = invoiced_quantity (the same goods the depot issues); sales_quantity is net of returns and can be negative.
  - Not depots: the hub 2010-0090, plant stores and the returns store 2010-0032; use fact_stock_daily for their stock and fact_stock_movements for movements: 313 = out of the hub, 315 = the same goods arriving (count one), 653 = customer return into the returns store, 602 = cancelled delivery back to the hub.
  - Products not kept at depots (services, raw materials) have empty depot stock: not a stock-out. A stock-out is is_stock_out = true.
  - "Current"/"now" = the latest activity_date in fact_sales_stock_daily.
  - To explain a drop in sales, check depot stock and is_stock_out, the hub's stock, the last 315 transfer to the depot, and what customers bought instead.
  - Fiscal year April-March, named by its start year (FY2026 = Apr 2026-Mar 2027). Months: the month field of sales_and_stock or CAST(DATE_TRUNC('MONTH', activity_date) AS DATE), never a timestamp.
  - A product group (e.g. weedicides) is product_group / product_group_name = 'WEEDICIDE', never a match on the product name.
  - "Kandy store"/"Kandy main store" = 4020-0010; "Kandy depot" = 2010-8003. When listing products, include product_id.
  - Answer in the shape asked: "how much / how many" = one total row; break down by province, depot, sales office, product, day or month only when the question says so; "which ... most" = full ranking unless a number is given.
  - Before/after comparisons: ONE row, one column per period (avg_daily_units_before, avg_daily_units_since). "From/since <date>" includes it, up to the latest activity_date; "the N days before" ends the day before. Average per day = total of all locations / days in the period.
  - Always state the date of the stock you used.
sample_questions:
  - Why did sales of MC6001LT stop in Western province?
  - Which products are out of stock at a depot while customers still order them?
  - Show sales and month-end depot stock by province for last month.
  - Which sales offices' depots ran out of stock most often this fiscal year?
  - How much stock does the Galle hub hold of products the depots have run out of?

# Columns to hide in the Genie agent (Configure > Data).
hidden_columns:
  fact_stock_movements: [material_document_item, reference_invoice_item, delivered_date]
  dim_location: [company_code, plant_code, storage_location_code, district_code]
  dim_product: [product_group_code, product_type_code, division_code, company_code, plant_code]

# Example SQL queries: teach Genie the cases that are easy to get wrong (taken from the answer key).
example_queries:
  - question: Show daily MC6001LT units invoiced and depot stock in Western from 18 to 26 October 2026.
    from_benchmark: SS02
  - question: For each province, what was net revenue in September 2026 and depot stock at the end of the month?
    from_benchmark: SS06
  - question: How much MC6001LT stock did the Western depots have in October 2026?
    from_benchmark: SS12

# Benchmarks: every question in genie/sales_and_stock/benchmarks.yaml EXCEPT the example queries above.
# SS01 (the demo question) is deliberately NOT taught: the demo must show Genie reasoning, not recall.
benchmarks_exclude: [SS02, SS06, SS12]
target_accuracy_pct: 90
