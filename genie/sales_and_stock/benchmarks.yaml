# "Sales & Stock" Genie benchmark questions: questions that need sales and stock together.
#
# Same format as genie/benchmarks.yaml (sales). `uv run python -m sales_insights.semantic.answer_key --genie
# sales_and_stock` runs every query and writes genie/sales_and_stock/answer_key.csv. Includes the demo question
# "Why did MC6001LT sales stop in Western?" (SS01).
# Placeholders like $${fact_sales_stock_daily} are replaced with real table names.
#
# Conventions used by every query (the same as the sales_and_stock metric view):
#   fact_sales_stock_daily: one row per day x sales office x product; sales add up, depot stock does not
#   depot stock for a period = the stock on its last day; province = the sales office's (and depot's) province
#   net revenue   = SUM(net_revenue_amount) (same as fact_sales); units sold = SUM(sales_quantity) (net)
#   "still selling?" = units invoiced, SUM(invoiced_quantity): returns of older invoices make net units negative
#   hub, plant stores and returns store are not depots: use fact_stock_daily for them

questions:
  # ---------------------------------------------------------------- the demo question and other stories
  - id: SS01
    category: story
    story: 7 + I1 MC6001LT stops selling in Western from 23 October 2026 because the Western depots are empty
    question: How many MC6001LT units did Western invoice from 23 October 2026 onwards, and how much MC6001LT stock did the Western depots hold on 22 October 2026?
    notes: The demo asks "why did sales stop?" live; Genie answers that in words, which the grader cannot score, so the benchmark checks the two facts behind it.
    paraphrases:
      - MC600 WEEDICIDE 1LTR units invoiced in Western since 23 Oct 2026, and the Western depots' stock of it on 22 Oct 2026?
      - Since 23 October 2026, how many cases of MC6001LT did Western invoice, and what was the Western depots' MC6001LT stock on 22 October?
    needs_data_until: 2026-10-25
    sql: |
      SELECT
        (SELECT COALESCE(SUM(f.invoiced_quantity), 0)
           FROM ${fact_sales_stock_daily} f JOIN ${dim_location} l ON f.location_id = l.location_id
           WHERE f.product_id = 'MC6001LT' AND l.province = 'Western' AND f.activity_date >= DATE'2026-10-23')
          AS units_invoiced_since_23_oct,
        (SELECT SUM(f.stock_quantity)
           FROM ${fact_sales_stock_daily} f JOIN ${dim_location} l ON f.location_id = l.location_id
           WHERE f.product_id = 'MC6001LT' AND l.province = 'Western' AND f.activity_date = DATE'2026-10-22')
          AS western_depot_stock_22_oct
    check: row['units_invoiced_since_23_oct'] == 0 and row['western_depot_stock_22_oct'] == 0

  - id: SS02
    category: story
    story: 7 + I1 day by day, MC6001LT sales in Western stop the day after the depots run empty
    question: Show daily MC6001LT units invoiced and depot stock in Western from 18 to 26 October 2026.
    paraphrases:
      - Day by day from 18 to 26 Oct 2026, how much MC600 WEEDICIDE 1LTR did Western sell and how much stock did its depots have?
      - Daily Western sales vs depot stock of MC6001LT, 18-26 October 2026.
    needs_data_until: 2026-10-26
    sql: |
      SELECT f.activity_date, SUM(f.invoiced_quantity) AS units_invoiced, SUM(f.stock_quantity) AS depot_stock
      FROM ${fact_sales_stock_daily} f JOIN ${dim_location} l ON f.location_id = l.location_id
      WHERE f.product_id = 'MC6001LT' AND l.province = 'Western'
        AND f.activity_date BETWEEN DATE'2026-10-18' AND DATE'2026-10-26'
      GROUP BY f.activity_date
      ORDER BY f.activity_date
    check: >-
      len(rows) == 9
      and all(r['depot_stock'] == 0 and r['units_invoiced'] == 0 for r in rows if r['activity_date'] >= date(2026, 10, 23))
      and all(r['units_invoiced'] > 0 for r in rows if r['activity_date'] <= date(2026, 10, 22))

  - id: SS03
    category: story
    story: I2 Western buyers switch to the 4-litre pack MC6004LT while MC6001LT is out of stock
    question: How did average daily units of MC6004LT sold in Western change from 23 October 2026 (when MC6001LT ran out), compared with the 30 days before?
    paraphrases:
      - Did Western customers buy more of the 4-litre MC600 WEEDICIDE pack per day from 23 Oct 2026, when the 1-litre pack ran out, than in the 30 days before?
      - MC6004LT units sold per day in Western since 23 Oct 2026 versus the 30 days before?
    needs_data_until: 2026-10-25
    sql: |
      SELECT
        ROUND(SUM(CASE WHEN f.activity_date BETWEEN DATE'2026-09-23' AND DATE'2026-10-22' THEN f.invoiced_quantity END) / 30, 1)
          AS avg_daily_units_before,
        ROUND(SUM(CASE WHEN f.activity_date >= DATE'2026-10-23' THEN f.invoiced_quantity END)
              / NULLIF(COUNT(DISTINCT CASE WHEN f.activity_date >= DATE'2026-10-23' THEN f.activity_date END), 0), 1)
          AS avg_daily_units_since
      FROM ${fact_sales_stock_daily} f JOIN ${dim_location} l ON f.location_id = l.location_id
      WHERE f.product_id = 'MC6004LT' AND l.province = 'Western'
    check: 10 * row['avg_daily_units_since'] > 13 * row['avg_daily_units_before']  # 30% more; whole numbers: Spark returns decimals

  - id: SS04
    category: story
    story: I4 + 6 HGL400ML returns pile up in the returns store
    question: How many HGL400ML units were returned from July to September 2026, and how much did the returns store stock of HGL400ML grow?
    paraphrases:
      - In total for July to September 2026, HGL INSECTICIDE 400ML units returned versus the growth of its returns store stock?
      - HGL400ML units returned by customers from 1 Jul to 30 Sep 2026, versus the increase in returns store stock between 30 Jun and 30 Sep 2026?
    sql: |
      SELECT
        (SELECT SUM(quantity) FROM ${fact_stock_movements}
           WHERE product_id = 'HGL400ML' AND movement_type = '653' AND location_id = '2010-0032'
             AND posting_date BETWEEN DATE'2026-07-01' AND DATE'2026-09-30') AS units_returned,
        (SELECT SUM(CASE WHEN snapshot_date = DATE'2026-09-30' THEN stock_quantity ELSE -stock_quantity END)
           FROM ${fact_stock_daily}
           WHERE product_id = 'HGL400ML' AND location_id = '2010-0032'
             AND snapshot_date IN (DATE'2026-06-30', DATE'2026-09-30')) AS returns_store_growth
    check: row['units_returned'] > 0 and row['returns_store_growth'] > 0

  - id: SS05
    category: story
    story: I3 the Kandy store spare kit S-10000576 has months of cover but sells only a few a month
    question: How many units of S-10000576 did we sell from July to September 2026, and how much stock was left at the Kandy Production Facility main store on 30 September?
    paraphrases:
      - SYSTEM SV SPARE KIT C sales in Jul-Sep 2026 versus its Kandy main store stock at the end of September?
      - S-10000576 units sold July to September 2026 versus its stock at the Kandy main store on 30 September 2026?
    sql: |
      SELECT
        (SELECT SUM(sold_quantity) FROM ${fact_sales}
           WHERE product_id = 'S-10000576' AND invoice_date BETWEEN DATE'2026-07-01' AND DATE'2026-09-30') AS units_sold,
        (SELECT SUM(stock_quantity) FROM ${fact_stock_daily}
           WHERE product_id = 'S-10000576' AND location_id = '4020-0010' AND snapshot_date = DATE'2026-09-30') AS stock_30_sep
    check: row['stock_30_sep'] > row['units_sold']

  # ---------------------------------------------------------------- basics
  - id: SS06
    category: basic
    question: For each province, what was net revenue in September 2026 and depot stock at the end of the month?
    paraphrases:
      - September 2026 sales and month-end depot stock by province.
      - By region, how much did we sell in Sep 2026 and how much stock did the depots hold on 30 September?
    sql: |
      SELECT l.province,
             ROUND(SUM(f.net_revenue_amount), 2) AS net_revenue,
             SUM(CASE WHEN f.activity_date = DATE'2026-09-30' THEN f.stock_quantity END) AS depot_stock_30_sep
      FROM ${fact_sales_stock_daily} f JOIN ${dim_location} l ON f.location_id = l.location_id
      WHERE f.activity_date BETWEEN DATE'2026-09-01' AND DATE'2026-09-30'
      GROUP BY l.province
      ORDER BY net_revenue DESC
    check: len(rows) == 9

  - id: SS07
    category: basic
    question: What was total net revenue in September 2026?
    notes: The combined table holds every sales line (also products not stocked at depots), so it equals the sales total.
    paraphrases:
      - How much did we sell in Sep 2026 in total?
      - Total sales for September 2026?
    sql: |
      SELECT ROUND(SUM(net_revenue_amount), 2) AS net_revenue
      FROM ${fact_sales}
      WHERE invoice_date BETWEEN DATE'2026-09-01' AND DATE'2026-09-30'
    check: row['net_revenue'] > 0

  - id: SS08
    category: basic
    question: How many days of depot cover did MC6001LT have in each province on 30 September 2026?
    paraphrases:
      - On 30 Sep 2026, how long would the depots' MC600 WEEDICIDE 1LTR last in each region?
      - MC6001LT depot days of cover by province at the end of September 2026.
    sql: |
      SELECT l.province,
             ROUND(SUM(f.stock_quantity) / NULLIF(SUM(f.avg_daily_issued_quantity_28d), 0), 1) AS days_of_cover
      FROM ${fact_sales_stock_daily} f JOIN ${dim_location} l ON f.location_id = l.location_id
      WHERE f.product_id = 'MC6001LT' AND f.activity_date = DATE'2026-09-30'
      GROUP BY l.province
      ORDER BY days_of_cover

  - id: SS09
    category: basic
    question: Which sales offices had the most depot stock-out days in fiscal year 2026, and what was their net revenue?
    paraphrases:
      - In FY2026, which sales offices' depots were out of stock most often, and how much did they sell?
      - Depot stock-out days and net revenue by sales office for fiscal year 2026.
    sql: |
      SELECT f.sales_office_code,
             COUNT_IF(f.is_stock_out) AS stock_out_days, ROUND(SUM(f.net_revenue_amount), 2) AS net_revenue
      FROM ${fact_sales_stock_daily} f
      JOIN ${dim_date} d ON f.activity_date = d.date
      WHERE d.fiscal_year = 2026
      GROUP BY f.sales_office_code
      ORDER BY stock_out_days DESC, net_revenue DESC

  # ---------------------------------------------------------------- trends
  - id: SS10
    category: trend
    question: Show monthly net revenue and month-end depot stock of weedicides for fiscal year 2026.
    paraphrases:
      - For FY2026, weedicide sales per month next to the depot stock at each month end.
      - Month by month in fiscal year 2026, how did weedicide revenue and depot stock move?
    sql: |
      WITH weed AS (
        SELECT d.month_start_date AS month, f.*
        FROM ${fact_sales_stock_daily} f
        JOIN ${dim_product} p ON f.product_id = p.product_id
        JOIN ${dim_date} d ON f.activity_date = d.date
        WHERE p.product_group_name = 'WEEDICIDE' AND d.fiscal_year = 2026
      ),
      month_ends AS (SELECT month, MAX(activity_date) AS month_end FROM weed GROUP BY month)
      SELECT w.month, ROUND(SUM(w.net_revenue_amount), 2) AS net_revenue,
             SUM(CASE WHEN w.activity_date = e.month_end THEN w.stock_quantity END) AS month_end_depot_stock
      FROM weed w JOIN month_ends e ON w.month = e.month
      GROUP BY w.month
      ORDER BY w.month
    check: len(rows) >= 6

  - id: SS11
    category: trend
    question: How many cases of MC6001LT did Western sell per day in the 30 days before 23 October 2026?
    paraphrases:
      - Before the stock-out, what was the average daily number of MC600 WEEDICIDE 1LTR units sold in Western (23 Sep to 22 Oct 2026)?
      - Average daily units of MC6001LT sold in the Western province from 23 September to 22 October 2026?
    needs_data_until: 2026-10-23
    sql: |
      SELECT ROUND(SUM(f.invoiced_quantity) / 30, 1) AS avg_daily_units
      FROM ${fact_sales_stock_daily} f JOIN ${dim_location} l ON f.location_id = l.location_id
      WHERE f.product_id = 'MC6001LT' AND l.province = 'Western'
        AND f.activity_date BETWEEN DATE'2026-09-23' AND DATE'2026-10-22'
    check: row['avg_daily_units'] > 50

  # ---------------------------------------------------------------- tricky
  - id: SS12
    category: tricky
    question: How much MC6001LT stock did the Western depots have in October 2026?
    notes: Stock is a level. "In October" = stock on the last day of October in the data, not the sum over the days.
    paraphrases:
      - Western depot stock of MC600 WEEDICIDE 1LTR for October 2026?
      - How much MC6001LT was held at the depots in the Western province in Oct 2026?
    sql: |
      WITH last_day AS (
        SELECT MAX(activity_date) AS stock_date
        FROM ${fact_sales_stock_daily}
        WHERE activity_date BETWEEN DATE'2026-10-01' AND DATE'2026-10-31'
      )
      SELECT SUM(f.stock_quantity) AS depot_stock
      FROM ${fact_sales_stock_daily} f
      JOIN ${dim_location} l ON f.location_id = l.location_id
      JOIN last_day ld ON f.activity_date = ld.stock_date
      WHERE f.product_id = 'MC6001LT' AND l.province = 'Western'

  - id: SS13
    category: tricky
    question: Which products sold in Western in September 2026 were not stocked at any depot?
    notes: Building solutions, services and raw materials are not held at depots (empty depot stock), which is not a stock-out.
    paraphrases:
      - In Sep 2026, which products sold in Western had no depot stock row (products not kept at depots)?
      - List products sold in Western in September 2026 that the depots do not stock.
    sql: |
      SELECT f.product_id, p.product_description
      FROM ${fact_sales_stock_daily} f
      JOIN ${dim_location} l ON f.location_id = l.location_id
      JOIN ${dim_product} p ON f.product_id = p.product_id
      WHERE l.province = 'Western' AND f.activity_date BETWEEN DATE'2026-09-01' AND DATE'2026-09-30'
      GROUP BY f.product_id, p.product_description
      HAVING COUNT(f.stock_quantity) = 0 AND SUM(f.sales_quantity) <> 0
      ORDER BY f.product_id

  - id: SS14
    category: tricky
    question: For each depot, how much was issued to customers in September 2026, and how many units did its sales office sell?
    notes: >-
      Issues match invoiced units; net units sold are lower because returns and cancellations take goods back
      into the returns store or the hub, not the depot. The difference is by design, not an error.
    paraphrases:
      - Goods issues versus units sold for each depot in Sep 2026.
      - For each depot, issued quantity and units sold in September 2026, side by side.
    sql: |
      SELECT l.location_name AS depot, SUM(f.issued_quantity) AS issued_quantity,
             SUM(f.invoiced_quantity) AS units_invoiced
      FROM ${fact_sales_stock_daily} f JOIN ${dim_location} l ON f.location_id = l.location_id
      WHERE f.activity_date BETWEEN DATE'2026-09-01' AND DATE'2026-09-30' AND f.stock_quantity IS NOT NULL
      GROUP BY l.location_name
      ORDER BY depot

  - id: SS15
    category: tricky
    question: What is the latest date for which we have both sales and stock data?
    notes: The combined view only covers days both feeds have delivered; if one area is a day late, the latest day is the earlier one.
    paraphrases:
      - Up to which day do the sales and stock numbers both go?
      - How fresh is the sales and stock data?
    sql: |
      SELECT MAX(activity_date) AS data_until
      FROM ${fact_sales_stock_daily}
    check: row['data_until'] is not None
